name: Deploy demo

# Builds the browser demo once, then publishes it twice: to GitHub Pages, and
# as plain static files on the `vercel-site` branch, which Vercel serves as-is
# (Vercel's build machines have no Gleam toolchain, so nothing is built there).

on:
  push:
    branches: [main]
    paths: ["src/**", "web/**", "fixtures/**", "gleam.toml", "manifest.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the vercel-site branch
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
      - run: ./web/build.sh
      - name: Publish the static site to the vercel-site branch
        run: |
          cd _site
          git init -q -b vercel-site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Static demo built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vercel-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
